# frpc reverse tunnel: exposes the local axon (proteus-miner:8091) on the public
# relay as RELAY_HOST:RELAY_PORT, so validators can reach a miner that sits
# behind CGNAT/NAT. Values come from the environment (set by run.sh).
serverAddr = "{{ .Envs.RELAY_HOST }}"
serverPort = 7000
auth.method = "token"
auth.token = "{{ .Envs.RELAY_TOKEN }}"

[[proxies]]
# Namespaced per miner: frp scopes proxy names to the SERVER, not to the client,
# so a fixed name means the first tunnel online owns it and every other miner is
# refused with "proxy already exists". RELAY_PORT is derived from the hotkey and
# is already unique, so it doubles as the namespace.
name = "axon-{{ .Envs.RELAY_PORT }}"
type = "tcp"
localIP = "proteus-miner"
localPort = 8091
remotePort = {{ .Envs.RELAY_PORT }}

# Without this, frps opens the public port the moment frpc registers and keeps it
# open whatever happens behind: a dead axon still answers TCP, so `nc -zv` says
# "reachable" while the router gets nothing. The health check makes frpc withdraw
# the tunnel when the local axon stops answering, so the port state tells the truth.
healthCheck.type = "tcp"
healthCheck.timeoutSeconds = 3
healthCheck.maxFailed = 3
healthCheck.intervalSeconds = 10
