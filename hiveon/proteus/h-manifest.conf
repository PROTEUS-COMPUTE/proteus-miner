# PROTEUS custom miner for Hiveon / Hive OS.
#
# Read by the Hive agent and by the h-* scripts around it. CUSTOM_NAME must match
# the directory this file sits in, and the miner name selected in the flight sheet.

CUSTOM_NAME=proteus
CUSTOM_VERSION=1.0.0

# Generated by h-config.sh on every start, from the flight sheet fields.
CUSTOM_CONFIG_FILENAME=/hive/miners/custom/proteus/proteus.conf

# The agent appends .log and reads the tail of it for the web log viewer.
CUSTOM_LOG_BASENAME=/var/log/miner/proteus/proteus
