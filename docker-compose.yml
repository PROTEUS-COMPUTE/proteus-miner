# PROTEUS miner stack for Linux.
#   vllm   : GPU inference server (needs nvidia-container-toolkit)
#   miner  : the bittensor neuron, calls vllm, signs with your local hotkey
#   frpc   : OPTIONAL reverse tunnel (profile "relay") for home GPUs behind
#            CGNAT/NAT that cannot open an inbound port. On a public-IP machine
#            (cloud / dedicated server) you do NOT need it.
#
# Use a launcher, they fill the environment and derive the relay port:
#   ./run.sh                 # one GPU, public IP
#   RELAY=1 ./run.sh         # one GPU, behind CGNAT
#   ./rig.sh                 # multi-GPU host: one stack per card
#
# Every name and port below is suffixed with GPU_ID so several stacks coexist on
# one host. Defaults keep single-GPU behaviour identical to before.
services:
  vllm:
    # Pinned, but overridable: the pinned build predates the RTX 50 series and has
    # no kernels for its architecture, so those cards need a newer image. See
    # VLLM_IMAGE in .env.example.
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.6.6.post1}
    container_name: proteus-vllm-${GPU_ID:-0}
    restart: unless-stopped
    ipc: host
    volumes:
      # Shared across every stack on the host: one download, not one per card.
      - proteus-hf:/root/.cache/huggingface
    environment:
      # Text-only workload. The multi-modal cache otherwise reserves host RAM we
      # will never use, which matters when several stacks share one machine.
      VLLM_MM_INPUT_CACHE_GIB: "0"
    command: >
      --model ${MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
      --host 0.0.0.0 --port 8000
      --max-model-len ${MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${GPU_UTIL:-0.90}
      --max-num-seqs ${MAX_NUM_SEQS:-64}
      --swap-space ${SWAP_SPACE:-4}
      ${VLLM_EXTRA:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # One specific card, not all of them: several stacks must not fight
              # over the same GPU.
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]

  miner:
    image: ghcr.io/proteus-compute/proteus-miner:latest
    # Building from this checkout is always possible, so a registry that is
    # unreachable, rate limited or not yet published never blocks a miner:
    # `docker compose build miner` produces the same image locally. run.sh
    # falls back to it automatically when the pull fails.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proteus-miner-${GPU_ID:-0}
    restart: unless-stopped
    depends_on: [vllm]
    volumes:
      - ${HOME}/.bittensor:/root/.bittensor
    environment:
      VLLM_HOST: http://proteus-vllm-${GPU_ID:-0}:8000
      MODEL_NAME: ${MODEL:-Qwen/Qwen2.5-3B-Instruct-AWQ}
    # RELAY_EXTERNAL is empty without relay; the launcher fills it with
    # --axon.external_ip/--axon.external_port when RELAY=1.
    command: >
      --netuid 1
      --subtensor.chain_endpoint ${RPC:-wss://rpc.proteus-agent.com}
      --wallet.name ${WALLET_NAME:-miner}
      --wallet.hotkey ${WALLET_HOTKEY:-expert1}
      --axon.port ${AXON_PORT:-8091}
      --expert.backend vllm
      ${RELAY_EXTERNAL:-}

  frpc:
    image: snowdreamtech/frpc:latest
    container_name: proteus-frpc-${GPU_ID:-0}
    restart: unless-stopped
    depends_on: [miner]
    profiles: [relay]
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    environment:
      RELAY_HOST: ${RELAY_HOST}
      RELAY_TOKEN: ${RELAY_TOKEN}
      RELAY_PORT: ${RELAY_PORT}
      MINER_HOST: proteus-miner-${GPU_ID:-0}
      AXON_PORT: ${AXON_PORT:-8091}

volumes:
  proteus-hf:
